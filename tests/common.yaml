# Stricter warnings than a normal build. CI fails on any warning from our own
# code, see check_warnings.sh.
esphome:
  build_flags:
    - -Wall
    - -Wextra
    - -Wno-unused-parameter
    - -Wsign-compare
    - -Wunused-but-set-variable
    - -Wunused-variable

api:
ota:
  - platform: esphome

wifi:
  ssid: "ci"
  password: "ci-password"

# The components from this checkout, not GitHub
substitutions:
  flexit_component_source: ../esphome/components

packages:
  core: !include ../packages/core.yaml
  controls: !include ../packages/controls.yaml
  sensors: !include ../packages/sensors.yaml
  diagnostics: !include ../packages/diagnostics.yaml
  fan_speeds: !include ../packages/fan_speeds.yaml
  fireplace: !include ../packages/fireplace.yaml
  humidity_boost: !include ../packages/humidity_boost.yaml
  co2: !include ../packages/co2.yaml
  summer_cooling: !include ../packages/summer_cooling.yaml
  computed: !include ../packages/computed.yaml
  advanced: !include ../packages/advanced.yaml
  health: !include ../packages/health.yaml
  quiet_hours: !include ../packages/quiet_hours.yaml
  ha_boost: !include ../packages/ha_boost.yaml

# Stand-ins for the sensors
sensor:
  - platform: template
    id: inside_humidity
    lambda: return 50.0;
  - platform: template
    id: co2
    lambda: return 600.0;
