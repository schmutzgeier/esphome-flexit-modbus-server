# The weather as a screensaver picture, drawn on the ESP from MET Norway's forecast, see code/met/met.h. Needs
# panel.yaml. Show it with the "Panel Picture" select or the panel_show_picture action.
#   - path: packages/panel/met.yaml
#     vars: {latitude: "59.9139", longitude: "10.7522"}
# redraw_interval redraws the picture. name, encoding and quality work as in picture.yaml, palette suits the flat
# colours. facing is the compass direction in the middle of the picture, where the sun, moon and stars are drawn:
# 0 north, 90 east, 180 south (the default), 270 west. scene and aurora start the Panel Weather Scene and Aurora
# selects. "Panel Animation Weather" brings it to life and takes the panel's animations, so turn your others off
# with it. The weather now is also a tile under Display > Home screen > Dashboard tiles.
# The heath scene is the cabin on the heath under the mountain (scripts/met_art). The climber runs the ridge in the
# rain, the kayaker comes ashore and runs with waves over 2 m or wind over 12 m/s, with snow both are out on skis,
# and in rain over 4 mm they and the dog are behind the cabin's big window, as from 23:30 (lights out at midnight)
# to 6. Some hours a reindeer and a walrus. The bay goes by the Beaufort scale, its waves as high as MET's
# Oceanforecast says, asked for after the forecast and again once it expires; inland it has none (a 422) and we ask
# again the next day. Streaks in the air above the bay show the wind too. "Panel Weather Forecast" draws the forecast
# over the picture with the wind and its gusts in brackets, in the clock band's font and shadow, and on the heath the
# wave height under the date. With "Panel Animation Weather" on, the heath's people, dog, reindeer and walrus move
# whenever someone's outside, the days and the weather staying still beside them; under the aurora and New Year's
# fireworks they're all in.
# Weather data: MET Norway, CC BY 4.0.
defaults:
  name: weather
  encoding: palette
  quality: auto
  redraw_interval: 5min
  scene: heath
  aurora: auto
  facing: "180"

# api.met.no's certificate is from HARICA, which ESPHome's usual root bundle doesn't have, so we take the full one.
# About 70 KB more flash.
esp32:
  framework:
    advanced:
      use_full_certificate_bundle: true
    sdkconfig_options:
      # TLS takes its buffers for each record as it comes and goes instead of 20 KB for the whole request, so the
      # request, which runs beside the pictures, needs less RAM at once. Closing a connection frees them either way.
      CONFIG_MBEDTLS_DYNAMIC_BUFFER: "y"

select:
  - id: !extend panel_picture
    options: ["${name}"]
  - platform: template
    id: panel_weather_scene
    name: "Panel Weather Scene"
    entity_category: config
    icon: "mdi:image-filter-hdr"
    options: ["hills", "coast", "mountains", "city", "heath"]
    initial_option: "${scene}"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          flexit::panel::met::options.ground = flexit::panel::met::ground_of(x.c_str());
          flexit::panel::met::redraw();
  - platform: template
    id: panel_weather_aurora
    name: "Panel Weather Aurora"
    entity_category: config
    icon: "mdi:aurora"
    options: ["auto", "off", "always"]
    initial_option: "${aurora}"
    optimistic: true
    restore_value: true
    set_action:
      - lambda: |-
          flexit::panel::met::options.aurora = flexit::panel::met::aurora_of(x.c_str());
          flexit::panel::met::redraw();

switch:
  - platform: template
    id: panel_weather_forecast
    name: "Panel Weather Forecast"
    entity_category: config
    icon: "mdi:weather-cloudy-clock"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - lambda: flexit::panel::met::with_forecast = true; flexit::panel::met::redraw();
    on_turn_off:
      - lambda: flexit::panel::met::with_forecast = false; flexit::panel::met::redraw();
  - platform: template
    id: panel_weather_animation
    name: "Panel Animation Weather"
    icon: "mdi:weather-partly-snowy-rainy"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      - lambda: flexit::panel::met::animate(true);
    on_turn_off:
      - lambda: flexit::panel::met::animate(false);

text_sensor:
  - platform: template
    id: panel_weather
    name: "Panel Weather"
    entity_category: diagnostic
    icon: "mdi:weather-partly-cloudy"

esphome:
  # Only here, so builds without the weather don't compile its .cpp files
  includes:
    - ../code/met
  on_boot:
    - then:
        - lambda: |-
            flexit::panel::met::setup(${latitude}, ${longitude}, "${name}", "${encoding}", "${quality}",
                                      id(panel_weather));
            flexit::panel::met::options.ground = flexit::panel::met::ground_of(id(panel_weather_scene).current_option().c_str());
            flexit::panel::met::options.aurora = flexit::panel::met::aurora_of(id(panel_weather_aurora).current_option().c_str());
            flexit::panel::met::options.facing = ${facing};

interval:
  - interval: 50ms  # what the weather animations do next
    then:
      - lambda: flexit::panel::met::live::loop(flexit::panel::picture::S.want == flexit::panel::met::name);
  - interval: ${redraw_interval}
    then:
      - lambda: |-
          flexit::panel::met::options.heater_pct = id(server).read_holding_register(flexit_modbus_server::REG_PERCENTAGE_HEATING);
          flexit::panel::met::redraw();
